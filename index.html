<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字在9 · 内测安装</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #1b1f27;
      --text: #f2f2f7;
      --muted: #9aa0a6;
      --accent: #0a84ff;
      --line: rgba(255,255,255,.08);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef1f5;
        --card: #ffffff;
        --text: #1c1c1e;
        --muted: #6c6c70;
        --accent: #007aff;
        --line: rgba(0,0,0,.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 24px 16px 48px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 16px;
      margin-bottom: 14px;
    }
    h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .sub { color: var(--muted); margin: 0 0 10px; font-size: .92rem; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: white !important;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      margin: 4px 0 12px;
    }
    ol { padding-left: 1.2rem; color: var(--muted); }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <main>
    <h1>字在9 · 内测安装</h1>
    <p class="lead">请用 iPhone Safari 打开本页，点「安装」。</p>
    
      <section class="card">
        <h2>字在9</h2>
        <p class="sub">0.1.0 (build 139)</p>
        <a class="btn" href="itms-services://?action=download-manifest&url=https%3A%2F%2Fbydingnan.github.io%2Fzizai9-ota%2Fmanifest-zizai9.plist">安装</a>
      </section>

    <section class="card">
      <h2>装完后必做</h2>
      <ol>
        <li>设置 → 通用 → VPN与设备管理：如有未信任描述文件/开发者，先信任。</li>
        <li>设置 → 通用 → 键盘 → 键盘 → 添加「字在9键盘」。</li>
        <li>点进该键盘，打开「允许完全访问」。</li>
        <li>任意输入框切换到对应键盘。</li>
      </ol>
    </section>
  </main>
</body>
</html>
